spring.application.name=askbot
server.port=8080

# ---------- PostgreSQL (no H2) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/askbot
spring.datasource.username=postgres
spring.datasource.password=2222
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- Anthropic ----------
askbot.anthropic.api-key=${ANTHROPIC_API_KEY:}
askbot.anthropic.model=claude-sonnet-4-6

logging.level.tz.ac.dit.askbot=INFO
